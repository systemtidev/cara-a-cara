<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem é Quem? (Cara a Cara)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React e Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const FM = window.Motion || window.FramerMotion;
        const MotionDiv = FM ? FM.motion.div : 'div';

        // ===== SPRITE (todas as cartas têm o MESMO tamanho, então a conta é exata) =====
        // O "?v=2" evita que o navegador/Vercel mostre o sprite antigo em cache.
        const SPRITE_URL = './sprite.png?v=2';

        const CW = 300;        // largura de cada cartinha no sprite
        const CH = 400;        // altura de cada cartinha no sprite (formato em pé, 3:4)
        const PAD = 8;         // margem de segurança em volta de cada cartinha
        const STRIDE_X = CW + PAD * 2;   // 316
        const STRIDE_Y = CH + PAD * 2;   // 416
        const SW = STRIDE_X * 5;         // 1580 (largura total do sprite)
        const SH = STRIDE_Y * 5;         // 2080 (altura total do sprite)

        const CHARACTERS = [
            { id: 1, nome: "Enzo", col: 0, row: 0 }, { id: 2, nome: "Sofia", col: 1, row: 0 }, { id: 3, nome: "Lucas", col: 2, row: 0 }, { id: 4, nome: "Alice", col: 3, row: 0 }, { id: 5, nome: "Pedro", col: 4, row: 0 },
            { id: 6, nome: "Laura", col: 0, row: 1 }, { id: 7, nome: "Felipe", col: 1, row: 1 }, { id: 8, nome: "Camila", col: 2, row: 1 }, { id: 9, nome: "Henrique", col: 3, row: 1 }, { id: 10, nome: "Beatriz", col: 4, row: 1 },
            { id: 11, nome: "Matheus", col: 0, row: 2 }, { id: 12, nome: "Isabela", col: 1, row: 2 }, { id: 13, nome: "Bruno", col: 2, row: 2 }, { id: 14, nome: "Larissa", col: 3, row: 2 }, { id: 15, nome: "Gustavo", col: 4, row: 2 },
            { id: 16, nome: "Aline", col: 0, row: 3 }, { id: 17, nome: "Daniel", col: 1, row: 3 }, { id: 18, nome: "Renata", col: 2, row: 3 }, { id: 19, nome: "Carlos", col: 3, row: 3 }, { id: 20, nome: "Paula", col: 4, row: 3 },
            { id: 21, nome: "Gabriel", col: 0, row: 4 }, { id: 22, nome: "Vitória", col: 1, row: 4 }, { id: 23, nome: "Arthur", col: 2, row: 4 }, { id: 24, nome: "Elisa", col: 3, row: 4 }, { id: 25, nome: "Miguel", col: 4, row: 4 }
        ];

        // Mostra exatamente uma cartinha do sprite. Serve para o tabuleiro E para a carta sorteada.
        // O tamanho vem sempre da largura do pai; a altura acompanha pela proporção (aspectRatio),
        // então não há como a imagem esticar ou vazar para a carta vizinha.
        const SpriteAvatar = ({ col, row }) => {
            const px = PAD + col * STRIDE_X;
            const py = PAD + row * STRIDE_Y;
            return (
                <div
                    style={{
                        width: '100%',
                        aspectRatio: `${CW} / ${CH}`,
                        backgroundImage: `url(${SPRITE_URL})`,
                        backgroundRepeat: 'no-repeat',
                        backgroundSize: `${(SW / CW) * 100}% auto`,
                        backgroundPosition: `${(px / (SW - CW)) * 100}% ${(py / (SH - CH)) * 100}%`
                    }}
                />
            );
        };

        const MAX_FLY_MS = 1400;

        function App() {
            const [eliminated, setEliminated] = useState(new Set());
            const [mySecretCard, setMySecretCard] = useState(null);
            const [isRolling, setIsRolling] = useState(false);
            const [flying, setFlying] = useState(new Set());
            const timers = useRef({});
            const rollRef = useRef(null);

            // Pré-carrega o sprite para a roleta não piscar na primeira vez
            useEffect(() => {
                const img = new Image();
                img.src = SPRITE_URL;
                return () => {
                    if (rollRef.current) clearInterval(rollRef.current);
                };
            }, []);

            const startFlying = (id) => {
                setFlying((prev) => new Set(prev).add(id));
                clearTimeout(timers.current[id]);
                timers.current[id] = setTimeout(() => stopFlying(id), MAX_FLY_MS);
            };

            const stopFlying = (id) => {
                clearTimeout(timers.current[id]);
                setFlying((prev) => {
                    if (!prev.has(id)) return prev;
                    const next = new Set(prev);
                    next.delete(id);
                    return next;
                });
            };

            const pickRandom = (exceptId) => {
                let c;
                do {
                    c = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
                } while (c.id === exceptId);
                return c;
            };

            const drawCard = () => {
                if (isRolling) return;
                setIsRolling(true);

                const TICKS = 16;
                let counter = 0;
                let last = mySecretCard ? mySecretCard.id : null;

                rollRef.current = setInterval(() => {
                    const c = pickRandom(last);
                    last = c.id;
                    setMySecretCard(c);
                    counter++;
                    if (counter >= TICKS) {
                        clearInterval(rollRef.current);
                        rollRef.current = null;
                        setIsRolling(false);
                    }
                }, 100);
            };

            const toggleEliminate = (id) => {
                startFlying(id);
                setEliminated((prev) => {
                    const next = new Set(prev);
                    next.has(id) ? next.delete(id) : next.add(id);
                    return next;
                });
            };

            const resetGame = () => {
                // para a roleta se ela estiver girando
                if (rollRef.current) {
                    clearInterval(rollRef.current);
                    rollRef.current = null;
                }
                setIsRolling(false);
                Object.values(timers.current).forEach(clearTimeout);
                setEliminated(new Set());
                setMySecretCard(null);
                setFlying(new Set());
            };

            const sortedCharacters = [...CHARACTERS].sort((a, b) => {
                const aElim = eliminated.has(a.id);
                const bElim = eliminated.has(b.id);
                if (aElim && !bElim) return 1;
                if (!aElim && bElim) return -1;
                return a.id - b.id;
            });

            return (
                <div className="flex flex-col min-h-screen p-3 sm:p-4">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg mb-5 border border-slate-700 relative z-10">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-400">👤 Quem é Quem?</h1>
                            <p className="text-sm text-slate-400 mt-1">
                                <span className="text-red-400 font-semibold">Regra de Ouro:</span> É proibido perguntar se é Homem ou Mulher!
                            </p>
                        </div>

                        <div className="mt-4 md:mt-0 flex items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                            <div className="mr-4 text-right">
                                <span className="block text-xs uppercase text-slate-400 font-semibold">Sua carta secreta</span>
                                <span className="block text-sm text-slate-300">
                                    {!mySecretCard ? "Não sorteada" : isRolling ? "Sorteando..." : "Sorteada!"}
                                </span>
                            </div>

                            {/* Moldura = padding de 2px com cor de fundo (não mexe na proporção da carta) */}
                            <button
                                onClick={drawCard}
                                disabled={isRolling}
                                className={`w-24 sm:w-28 p-[2px] rounded-xl cursor-pointer transition-shadow ${!mySecretCard ? 'bg-slate-500' : 'bg-blue-500 shadow-md shadow-blue-500/30'}`}
                            >
                                <div className="rounded-[10px] overflow-hidden bg-slate-800">
                                    {!mySecretCard ? (
                                        <div
                                            style={{ aspectRatio: `${CW} / ${CH}` }}
                                            className="w-full flex items-center justify-center"
                                        >
                                            <span className="text-3xl animate-pulse">❓</span>
                                        </div>
                                    ) : (
                                        <SpriteAvatar col={mySecretCard.col} row={mySecretCard.row} />
                                    )}
                                </div>
                            </button>
                        </div>
                    </div>

                    {/* Barra de Status */}
                    <div className="flex justify-between items-center mb-4 relative z-10">
                        <div className="text-sm bg-slate-800 py-1 px-3 rounded-full border border-slate-700">
                            Restantes: <span className="font-bold text-blue-400">{25 - eliminated.size}</span>/25
                        </div>
                        <button onClick={resetGame} className="bg-blue-600 px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer hover:bg-blue-500">
                            🔄 Novo Jogo
                        </button>
                    </div>

                    {/* Tabuleiro: 3 colunas no celular, para ver mais cartas de uma vez */}
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 sm:gap-3 max-w-6xl mx-auto w-full pb-10">
                        {sortedCharacters.map((char) => {
                            const isEliminated = eliminated.has(char.id);
                            const isFlying = flying.has(char.id);

                            return (
                                <MotionDiv
                                    key={char.id}
                                    layout
                                    onClick={() => toggleEliminate(char.id)}
                                    onLayoutAnimationComplete={() => stopFlying(char.id)}
                                    initial={false}
                                    style={{ position: 'relative', zIndex: isFlying ? 50 : 1 }}
                                    animate={{
                                        scale: isFlying ? 1.12 : isEliminated ? 0.95 : 1,
                                        opacity: isEliminated && !isFlying ? 0.5 : 1,
                                        filter: isEliminated ? 'grayscale(100%)' : 'grayscale(0%)',
                                        boxShadow: isFlying
                                            ? '0 30px 40px -10px rgba(0,0,0,0.7), 0 0 28px rgba(148,163,184,0.45)'
                                            : '0 0 0 0 rgba(0,0,0,0)'
                                    }}
                                    transition={{
                                        layout: { duration: 1.2, ease: 'easeInOut' },
                                        default: { duration: 0.35 }
                                    }}
                                    className={`cursor-pointer select-none rounded-xl p-[2px] ${isEliminated ? 'bg-slate-700' : 'bg-slate-500'}`}
                                >
                                    <div className="rounded-[10px] overflow-hidden relative">
                                        <SpriteAvatar col={char.col} row={char.row} />
                                        {isEliminated && (
                                            <div className="absolute inset-0 bg-red-900/30 flex items-center justify-center z-20">
                                                <div className="text-white text-4xl sm:text-5xl drop-shadow-lg font-bold">❌</div>
                                            </div>
                                        )}
                                    </div>
                                </MotionDiv>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
