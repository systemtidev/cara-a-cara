<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem é Quem? (Cara a Cara)</title>
    
    <!-- Tailwind CSS para o estilo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React e Babel para a lógica -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- CSS AutoAnimate -->
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.2/index.global.js"></script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        
        /* Estilos base da carta */
        .card-container {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Efeito quando a carta está cinza/eliminada */
        .grayscale-card { 
            filter: grayscale(100%) opacity(60%); 
            transform: scale(0.95); 
        }

        /* EFEITO DE FLUTUAR: Quando a carta acabou de ser clicada */
        .floating-card {
            z-index: 50 !important; /* Joga a carta pra frente de todas as outras */
            transform: scale(1.1) translateY(-10px) !important; /* Dá um zoom e sobe ela */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(59, 130, 246, 0.5) !important; /* Sombra grande e brilhante */
            filter: grayscale(100%) opacity(90%) !important; /* Fica cinza, mas bem visível */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SPRITE_URL = './sprite.png'; no seu GitHub
       

        const CHARACTERS = [
            { id: 1, nome: "Enzo", col: 0, row: 0 }, { id: 2, nome: "Sofia", col: 1, row: 0 }, { id: 3, nome: "Lucas", col: 2, row: 0 }, { id: 4, nome: "Alice", col: 3, row: 0 }, { id: 5, nome: "Pedro", col: 4, row: 0 },
            { id: 6, nome: "Laura", col: 0, row: 1 }, { id: 7, nome: "Felipe", col: 1, row: 1 }, { id: 8, nome: "Camila", col: 2, row: 1 }, { id: 9, nome: "Henrique", col: 3, row: 1 }, { id: 10, nome: "Beatriz", col: 4, row: 1 },
            { id: 11, nome: "Matheus", col: 0, row: 2 }, { id: 12, nome: "Isabela", col: 1, row: 2 }, { id: 13, nome: "Bruno", col: 2, row: 2 }, { id: 14, nome: "Larissa", col: 3, row: 2 }, { id: 15, nome: "Gustavo", col: 4, row: 2 },
            { id: 16, nome: "Aline", col: 0, row: 3 }, { id: 17, nome: "Daniel", col: 1, row: 3 }, { id: 18, nome: "Renata", col: 2, row: 3 }, { id: 19, nome: "Carlos", col: 3, row: 3 }, { id: 20, nome: "Paula", col: 4, row: 3 },
            { id: 21, nome: "Gabriel", col: 0, row: 4 }, { id: 22, nome: "Vitória", col: 1, row: 4 }, { id: 23, nome: "Arthur", col: 2, row: 4 }, { id: 24, nome: "Elisa", col: 3, row: 4 }, { id: 25, nome: "Miguel", col: 4, row: 4 }
        ];

        const SpriteAvatar = ({ col, row }) => {
            const bgPosX = col * 25;
            const bgPosY = row * 25;
            return (
                <div 
                    className="w-full h-full bg-no-repeat rounded-lg"
                    style={{
                        backgroundImage: `url('${SPRITE_URL}')`,
                        backgroundSize: "500% 500%",
                        backgroundPosition: `${bgPosX}% ${bgPosY}%`
                    }}
                ></div>
            );
        };

        function App() {
            const [eliminated, setEliminated] = useState(new Set());
            const [mySecretCard, setMySecretCard] = useState(null);
            const [isRolling, setIsRolling] = useState(false);
            
            // Estado para controlar qual carta está "voando" agora
            const [flyingCardId, setFlyingCardId] = useState(null);
            
            const gridRef = useRef(null);

            useEffect(() => {
                if (gridRef.current && window.autoAnimate) {
                    window.autoAnimate(gridRef.current, { duration: 500, easing: 'ease-in-out' });
                }
            }, []);

            const drawCard = () => {
                if (isRolling) return;
                setIsRolling(true);
                let counter = 0;
                
                const interval = setInterval(() => {
                    setMySecretCard(CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)]);
                    counter++;
                    if (counter > 15) {
                        clearInterval(interval);
                        setIsRolling(false);
                    }
                }, 100);
            };

            const toggleEliminate = (id) => {
                const isEliminating = !eliminated.has(id);
                
                // Se estiver eliminando, aciona o efeito de voo
                if (isEliminating) {
                    setFlyingCardId(id);
                    
                    // Tira o efeito de voo depois que a animação terminar (500ms)
                    setTimeout(() => {
                        setFlyingCardId(null);
                    }, 500);
                }

                // Atualiza o estado
                const newEliminated = new Set(eliminated);
                if (isEliminating) {
                    newEliminated.add(id);
                } else {
                    newEliminated.delete(id);
                }
                setEliminated(newEliminated);
            };

            const resetGame = () => {
                setEliminated(new Set());
                setMySecretCard(null);
                setFlyingCardId(null);
            };

            const sortedCharacters = [...CHARACTERS].sort((a, b) => {
                const aElim = eliminated.has(a.id);
                const bElim = eliminated.has(b.id);
                
                if (aElim && !bElim) return 1;
                if (!aElim && bElim) return -1;
                return a.id - b.id;
            });

            return (
                <div className="flex flex-col min-h-screen p-4">
                    <div className="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700 relative z-10">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-400">👤 Quem é Quem?</h1>
                            <p className="text-sm text-slate-400 mt-1">
                                <span className="text-red-400 font-semibold">Regra de Ouro:</span> É proibido perguntar se é Homem ou Mulher!
                            </p>
                        </div>
                        
                        <div className="mt-4 md:mt-0 flex items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                            <div className="mr-4 text-right">
                                <span className="block text-xs uppercase text-slate-400 font-semibold">Sua carta secreta</span>
                                <span className="block text-sm text-slate-300">
                                    {!mySecretCard ? "Não sorteada" : isRolling ? "Sorteando..." : "Sorteada!"}
                                </span>
                            </div>
                            
                            <button 
                                onClick={drawCard}
                                disabled={isRolling}
                                className={`w-16 h-20 rounded-lg border-2 flex items-center justify-center bg-slate-800 overflow-hidden cursor-pointer ${!mySecretCard ? 'border-dashed border-slate-500' : 'border-blue-500 shadow-md shadow-blue-500/30'}`}
                            >
                                {!mySecretCard ? <span className="text-2xl animate-pulse">❓</span> : <SpriteAvatar {...mySecretCard} />}
                            </button>
                        </div>
                    </div>

                    <div className="flex justify-between items-center mb-4 relative z-10">
                        <div className="text-sm bg-slate-800 py-1 px-3 rounded-full border border-slate-700">
                            Restantes: <span className="font-bold text-blue-400">{25 - eliminated.size}</span>/25
                        </div>
                        <button onClick={resetGame} className="bg-blue-600 px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer hover:bg-blue-500">
                            🔄 Novo Jogo
                        </button>
                    </div>

                    <div ref={gridRef} className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 max-w-6xl mx-auto w-full pb-10">
                        {sortedCharacters.map((char) => {
                            const isEliminated = eliminated.has(char.id);
                            const isFlying = flyingCardId === char.id;
                            
                            // Define as classes baseado no estado atual da carta
                            let cardClasses = "card-container cursor-pointer select-none ";
                            
                            if (isFlying) {
                                cardClasses += "floating-card"; // Voando pra baixo
                            } else if (isEliminated) {
                                cardClasses += "grayscale-card z-0"; // Já tá lá embaixo
                            } else {
                                cardClasses += "hover:-translate-y-1 hover:shadow-lg hover:shadow-blue-500/20 z-10"; // Ativa e esperando clique
                            }

                            return (
                                <div 
                                    key={char.id}
                                    onClick={() => toggleEliminate(char.id)}
                                    className={cardClasses}
                                >
                                    <div className={`bg-slate-800 rounded-xl overflow-hidden border-2 flex flex-col aspect-square w-full h-full ${isEliminated || isFlying ? 'border-slate-700' : 'border-slate-600'}`}>
                                        <div className="w-full h-full relative bg-slate-800 p-1">
                                            <SpriteAvatar {...char} />
                                        </div>
                                        {isEliminated && (
                                            <div className="absolute inset-0 bg-red-900/30 flex items-center justify-center rounded-xl">
                                                <div className="text-white text-4xl drop-shadow-lg font-bold">❌</div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
