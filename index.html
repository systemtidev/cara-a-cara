<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quem é Quem? (Cara a Cara)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .character-card {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background-color: #1e293b;
            border: 2px solid #475569;
        }

        .character-sprite {
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size: 500% 500%;
        }

        .secret-card {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useRef, useEffect } = React;

        const FM = window.Motion || window.FramerMotion;

        const MotionDiv = FM ? FM.motion.div : 'div';

        const SPRITE_URL = './sprite.png';

        // =====================================================
        // PERSONAGENS
        // =====================================================

        const CHARACTERS = [
            { id: 1, nome: "Enzo", col: 0, row: 0 },
            { id: 2, nome: "Sofia", col: 1, row: 0 },
            { id: 3, nome: "Lucas", col: 2, row: 0 },
            { id: 4, nome: "Alice", col: 3, row: 0 },
            { id: 5, nome: "Pedro", col: 4, row: 0 },

            { id: 6, nome: "Laura", col: 0, row: 1 },
            { id: 7, nome: "Felipe", col: 1, row: 1 },
            { id: 8, nome: "Camila", col: 2, row: 1 },
            { id: 9, nome: "Henrique", col: 3, row: 1 },
            { id: 10, nome: "Beatriz", col: 4, row: 1 },

            { id: 11, nome: "Matheus", col: 0, row: 2 },
            { id: 12, nome: "Isabela", col: 1, row: 2 },
            { id: 13, nome: "Bruno", col: 2, row: 2 },
            { id: 14, nome: "Larissa", col: 3, row: 2 },
            { id: 15, nome: "Gustavo", col: 4, row: 2 },

            { id: 16, nome: "Aline", col: 0, row: 3 },
            { id: 17, nome: "Daniel", col: 1, row: 3 },
            { id: 18, nome: "Renata", col: 2, row: 3 },
            { id: 19, nome: "Carlos", col: 3, row: 3 },
            { id: 20, nome: "Paula", col: 4, row: 3 },

            { id: 21, nome: "Gabriel", col: 0, row: 4 },
            { id: 22, nome: "Vitória", col: 1, row: 4 },
            { id: 23, nome: "Arthur", col: 2, row: 4 },
            { id: 24, nome: "Elisa", col: 3, row: 4 },
            { id: 25, nome: "Miguel", col: 4, row: 4 }
        ];


        // =====================================================
        // FIGURINHA
        // =====================================================

        const SpriteAvatar = ({ col, row }) => {

            /*
             * O sprite tem 5 colunas e 5 linhas.
             *
             * O posicionamento percentual permite selecionar
             * cada célula da imagem original.
             *
             * As coordenadas são:
             * coluna 0 = 0%
             * coluna 1 = 25%
             * coluna 2 = 50%
             * coluna 3 = 75%
             * coluna 4 = 100%
             */

            const bgPosX = (col / 4) * 100;
            const bgPosY = (row / 4) * 100;

            return (
                <div
                    className="character-sprite"
                    style={{
                        backgroundImage: `url("${SPRITE_URL}")`,
                        backgroundPosition: `${bgPosX}% ${bgPosY}%`
                    }}
                />
            );
        };


        // =====================================================
        // APLICAÇÃO
        // =====================================================

        function App() {

            const [eliminated, setEliminated] = useState(new Set());

            const [mySecretCard, setMySecretCard] = useState(null);

            const [isRolling, setIsRolling] = useState(false);

            const [flying, setFlying] = useState(new Set());

            const timers = useRef({});

            const rollingInterval = useRef(null);


            // =================================================
            // LIMPEZA DOS TEMPORIZADORES
            // =================================================

            useEffect(() => {

                return () => {

                    Object.values(timers.current).forEach(clearTimeout);

                    if (rollingInterval.current) {
                        clearInterval(rollingInterval.current);
                    }

                };

            }, []);


            // =================================================
            // ANIMAÇÃO
            // =================================================

            const startFlying = (id) => {

                setFlying(prev => {

                    const next = new Set(prev);

                    next.add(id);

                    return next;

                });

                clearTimeout(timers.current[id]);

                timers.current[id] = setTimeout(() => {

                    stopFlying(id);

                }, 1400);

            };


            const stopFlying = (id) => {

                clearTimeout(timers.current[id]);

                setFlying(prev => {

                    if (!prev.has(id)) {
                        return prev;
                    }

                    const next = new Set(prev);

                    next.delete(id);

                    return next;

                });

            };


            // =================================================
            // SORTEIO DA CARTA SECRETA
            // =================================================

            const drawCard = () => {

                if (isRolling) return;

                setIsRolling(true);

                let counter = 0;

                rollingInterval.current = setInterval(() => {

                    const randomIndex = Math.floor(
                        Math.random() * CHARACTERS.length
                    );

                    setMySecretCard(CHARACTERS[randomIndex]);

                    counter++;

                    if (counter > 15) {

                        clearInterval(rollingInterval.current);

                        rollingInterval.current = null;

                        setIsRolling(false);

                    }

                }, 100);

            };


            // =================================================
            // ELIMINAR PERSONAGEM
            // =====================================================

            const toggleEliminate = (id) => {

                startFlying(id);

                setEliminated(prev => {

                    const next = new Set(prev);

                    if (next.has(id)) {
                        next.delete(id);
                    } else {
                        next.add(id);
                    }

                    return next;

                });

            };


            // =================================================
            // NOVO JOGO
            // =================================================

            const resetGame = () => {

                Object.values(timers.current).forEach(clearTimeout);

                timers.current = {};

                if (rollingInterval.current) {

                    clearInterval(rollingInterval.current);

                    rollingInterval.current = null;

                }

                setEliminated(new Set());

                setMySecretCard(null);

                setFlying(new Set());

                setIsRolling(false);

            };


            // =================================================
            // ORDENAR PERSONAGENS
            // =================================================

            const sortedCharacters = [...CHARACTERS].sort((a, b) => {

                const aElim = eliminated.has(a.id);

                const bElim = eliminated.has(b.id);

                if (aElim && !bElim) return 1;

                if (!aElim && bElim) return -1;

                return a.id - b.id;

            });


            // =================================================
            // INTERFACE
            // =================================================

            return (

                <div className="flex flex-col min-h-screen p-3 sm:p-4">

                    {/* CABEÇALHO */}

                    <header className="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700 relative z-10">

                        <div className="text-center md:text-left">

                            <h1 className="text-2xl font-bold text-blue-400">
                                👤 Quem é Quem?
                            </h1>

                            <p className="text-sm text-slate-400 mt-1">

                                <span className="text-red-400 font-semibold">
                                    Regra de Ouro:
                                </span>

                                {" "}É proibido perguntar se é Homem ou Mulher!

                            </p>

                        </div>


                        {/* CARTA SECRETA */}

                        <div className="mt-4 md:mt-0 flex items-center bg-slate-900 p-3 rounded-xl border border-slate-700">

                            <div className="mr-4 text-right">

                                <span className="block text-xs uppercase text-slate-400 font-semibold">
                                    Sua carta secreta
                                </span>

                                <span className="block text-sm text-slate-300 mt-1">

                                    {!mySecretCard
                                        ? "Não sorteada"
                                        : isRolling
                                            ? "Sorteando..."
                                            : "Sorteada!"
                                    }

                                </span>

                            </div>


                            <button
                                onClick={drawCard}
                                disabled={isRolling}
                                aria-label="Sortear carta secreta"
                                className={`w-28 h-32 rounded-lg border-2 flex items-center justify-center bg-slate-800 overflow-hidden ${
                                    !mySecretCard
                                        ? 'border-dashed border-slate-500'
                                        : 'border-blue-500 shadow-md shadow-blue-500/30'
                                }`}
                            >

                                {!mySecretCard ? (

                                    <span className="text-3xl animate-pulse">
                                        ❓
                                    </span>

                                ) : (

                                    <div className="secret-card">
                                        <SpriteAvatar {...mySecretCard} />
                                    </div>

                                )}

                            </button>

                        </div>

                    </header>


                    {/* STATUS */}

                    <div className="flex justify-between items-center mb-4 relative z-10 gap-2">

                        <div className="text-sm bg-slate-800 py-2 px-3 rounded-full border border-slate-700">

                            Restantes:

                            <span className="font-bold text-blue-400 ml-1">
                                {25 - eliminated.size}
                            </span>

                            /25

                        </div>


                        <button
                            onClick={resetGame}
                            className="bg-blue-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-500 transition-colors"
                        >

                            🔄 Novo Jogo

                        </button>

                    </div>


                    {/* TABULEIRO */}

                    <main className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 max-w-6xl mx-auto w-full pb-10">

                        {sortedCharacters.map(char => {

                            const isEliminated = eliminated.has(char.id);

                            const isFlying = flying.has(char.id);

                            return (

                                <MotionDiv
                                    key={char.id}
                                    layout
                                    onClick={() => toggleEliminate(char.id)}
                                    onLayoutAnimationComplete={() => stopFlying(char.id)}
                                    initial={false}

                                    style={{
                                        position: 'relative',
                                        zIndex: isFlying ? 50 : 1
                                    }}

                                    animate={{

                                        scale: isFlying
                                            ? 1.08
                                            : isEliminated
                                                ? 0.96
                                                : 1,

                                        opacity: isEliminated && !isFlying
                                            ? 0.5
                                            : 1,

                                        filter: isEliminated
                                            ? 'grayscale(100%)'
                                            : 'grayscale(0%)',

                                        boxShadow: isFlying
                                            ? '0 25px 35px -10px rgba(0,0,0,0.7)'
                                            : '0 0 0 0 rgba(0,0,0,0)'

                                    }}

                                    transition={{

                                        layout: {
                                            duration: 0.7,
                                            ease: 'easeInOut'
                                        },

                                        default: {
                                            duration: 0.3
                                        }

                                    }}

                                    className="cursor-pointer select-none rounded-xl w-full min-w-0"

                                >

                                    {/* QUADRINHO */}

                                    <div
                                        className={`character-card ${
                                            isEliminated
                                                ? 'border-slate-700'
                                                : 'border-slate-600'
                                        }`}
                                    >

                                        {/* IMAGEM ORIGINAL */}

                                        <SpriteAvatar {...char} />


                                        {/* MARCA DE ELIMINAÇÃO */}

                                        {isEliminated && (

                                            <div className="absolute inset-0 bg-red-900/30 flex items-center justify-center">

                                                <div className="text-white text-4xl drop-shadow-lg font-bold">
                                                    ❌
                                                </div>

                                            </div>

                                        )}

                                    </div>

                                </MotionDiv>

                            );

                        })}

                    </main>

                </div>

            );

        }


        // =====================================================
        // INICIAR APLICAÇÃO
        // =====================================================

        const root = ReactDOM.createRoot(
            document.getElementById('root')
        );

        root.render(<App />);

    </script>

</body>

</html>
